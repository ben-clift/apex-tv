<!doctype html>
<html lang="en-GB" data-root="../"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Where To Watch · Apex TV</title><meta name="theme-color" content="#07080c"><link rel="manifest" href="../manifest.webmanifest"><link rel="icon" href="../favicon.svg">
<link rel="stylesheet" href="../shared/style.css">
<style>
.fx{display:grid;grid-template-columns:1.6fr 1fr;gap:.2rem 1rem;align-items:center;padding:.9rem 1.1rem;margin-bottom:.6rem;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm)}
.fx .m{font-weight:700;font-size:1.05rem}.fx .c{color:var(--ink3);font-size:.8rem}.fx .t{color:var(--gold2);font-weight:650;text-align:right}.fx .wh{grid-column:1/-1;margin-top:.3rem}
.tabs{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1rem}
</style></head><body>
<header id="appbar" data-title="Where To Watch" data-icon="cal" data-sub=""></header>
<main class="page"><div class="tabs" id="tabs"></div><div id="list"></div>
<p class="small dim" style="margin-top:1rem">A guide only. It shows times and the official broadcaster and includes no streams.</p></main>
<script src="../shared/config.js"></script><script src="../shared/icons.js"></script><script src="../shared/app.js"></script>
<script>
var all=[],sport="All";
function crest(n){var w=n.replace(/^(SSC|AC|FC|Real)\s+/i,"").split(/\s+/),ini=(w[0][0]+(w[1]?w[1][0]:w[0][1]||"")).toUpperCase(),h=0;for(var i=0;i<n.length;i++)h=(h*31+n.charCodeAt(i))%360;return '<span class="crest" style="background:hsl('+h+',70%,62%)">'+A.esc(ini)+'</span>'}
function when(f){return new Date(f.kickoff.replace(" ","T")+":00")}
function render(){var now=new Date(),box=A.$("#list");box.innerHTML="";
  var rows=all.filter(function(f){return sport==="All"||f.sport===sport&&true}).filter(function(f){return (now-when(f))<4*3600000}).sort(function(a,b){return when(a)-when(b)});
  if(!rows.length){A.state(box,"empty","Nothing coming up","Add fixtures to fixtures.json in the repository.");return}
  rows.forEach(function(f){var d=when(f),mins=Math.round((d-now)/60000),st=mins>0?(mins>=1440?"in "+Math.floor(mins/1440)+" days":mins>=60?"in "+Math.floor(mins/60)+"h "+(mins%60)+"m":"in "+mins+" min"):(mins>-130?'<span class="live">LIVE</span>':"Full time");
    var unset=/\[ADD/.test(f.where);
    var c=A.el("div",{class:"fx"},'<div><div class="m" style="display:flex;align-items:center;gap:.6rem;flex-wrap:wrap">'+crest(f.home)+A.esc(f.home)+' <span class="dim">v</span> '+crest(f.away)+A.esc(f.away)+'</div><div class="c">'+A.esc(f.competition)+'</div></div><div class="t">'+d.toLocaleString("en-GB",{weekday:"short",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})+'<div class="small dim">'+st+'</div></div><div class="wh">'+(unset?'<span class="chip warn">Broadcaster not added yet</span>':'<span class="chip ok">'+A.esc(f.where)+'</span>')+'</div>');box.appendChild(c)})}
function tabs(){var s=["All"];all.forEach(function(f){if(s.indexOf(f.sport)<0)s.push(f.sport)});var t=A.$("#tabs");t.innerHTML="";
  s.forEach(function(n){var b=A.el("button",{class:"btn f"+(n===sport?" primary":""),type:"button"},A.esc(n));b.onclick=function(){sport=n;tabs();render()};t.appendChild(b)});A.fx()}
A.state("#list","load");
A.getJSON("fixtures.json").then(function(d){all=d.fixtures||[];A.$("#barsub").textContent=d.note||"";tabs();render()}).catch(function(e){A.state("#list","err","Could not load fixtures",e.message)});
A.dock([{label:"Home",icon:"home",key:"red",fn:A.goHome}]);setInterval(render,60000);
</script></body></html>
