<!doctype html><html><head><meta charset="utf-8"><title>Party Requests</title>
<link rel="stylesheet" href="shared/common.css"></head><body>
<div class="top"><h1>Request a track</h1><span class="dim" id="status"></span></div>
<div class="wrap" style="display:grid;grid-template-columns:520px 1fr;gap:48px">
  <div class="panel" style="text-align:center"><img id="qr" width="420" height="420" alt="QR" style="background:#fff;padding:12px;border-radius:12px"><p id="qrhint" class="dim"></p></div>
  <div><h2>Requests (most votes first)</h2><div id="list"></div>
  <p><span class="btn f" id="clear">Clear all</span> <span class="btn f" id="demo">Add demo request</span></p></div>
</div>
<script>window.HINTS='<span class="c-g">GREEN refresh</span><span class="c-r">RED clear</span>'</script>
<script src="shared/config.js"></script><script src="shared/common.js"></script>
<script>
// Friends open guest.html (host it on GitHub Pages), which posts a NAME of a track to Supabase.
// Requests are only text. You decide what to play. Nothing downloads from here.
var C=A.cfg, list=A.$("#list"), live=!!(C.supabaseUrl&&C.supabaseAnonKey);
var H={apikey:C.supabaseAnonKey,Authorization:"Bearer "+C.supabaseAnonKey,"Content-Type":"application/json"};
function setQR(){
  var u=C.guestPageUrl||"https://example.com/guest.html";
  A.$("#qr").src="https://api.qrserver.com/v1/create-qr-code/?size=420x420&data="+encodeURIComponent(u);
  A.$("#qrhint").textContent=C.guestPageUrl?"Scan to request a track":"Set guestPageUrl in config.js";
}
function draw(rows){
  rows.sort(function(a,b){return (b.votes||0)-(a.votes||0)});
  list.innerHTML="";
  if(!rows.length)list.appendChild(A.el("p",{class:"dim",text:"Nothing yet. Scan the code."}));
  rows.slice(0,10).forEach(function(r,i){
    list.appendChild(A.el("div",{class:"panel",style:"margin:10px 0;display:flex;justify-content:space-between"},[
      A.el("span",{text:(i+1)+". "+r.track+(r.who?"  ("+r.who+")":"")}),A.el("span",{class:"c-y",text:"▲ "+(r.votes||0)})]))});
}
function load(){
  if(!live){draw(A.store("requests")||[]);A.$("#status").textContent="Demo mode (saved on this TV only)";return}
  A.getJSON(C.supabaseUrl+"/rest/v1/requests?select=*&order=votes.desc&limit=30",{headers:H}).then(function(r){draw(r);A.$("#status").textContent="Live"})
   .catch(function(e){A.$("#status").textContent="Supabase problem: "+e.message})
}
function clearAll(){
  if(!live){A.store("requests",[]);return load()}
  // Needs a delete policy for the anon role, or do it from the Supabase dashboard
  fetch(C.supabaseUrl+"/rest/v1/requests?id=gt.0",{method:"DELETE",headers:H}).then(function(r){if(!r.ok)A.toast("Clear blocked. Delete rows in Supabase.");load()})
}
A.$("#clear").onclick=clearAll;A.on("red",clearAll);A.on("green",load);
A.$("#demo").onclick=function(){var r=A.store("requests")||[];r.push({track:"Demo track "+(r.length+1),who:"Guest",votes:Math.floor(Math.random()*5)});A.store("requests",r);load()};
setQR();load();setInterval(load,10000);
</script></body></html>
