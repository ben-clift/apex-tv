<!doctype html>
<html lang="en-GB" data-root="../"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lights · Apex TV</title><meta name="theme-color" content="#07080c"><link rel="manifest" href="../manifest.webmanifest"><link rel="icon" href="../favicon.svg">
<link rel="stylesheet" href="../shared/style.css">
<style>.sw{height:3.4rem;border-radius:.7rem;margin-bottom:.7rem}.sc{text-align:center;flex-direction:column;align-items:stretch;padding:.8rem}</style></head><body>
<header id="appbar" data-title="Lights" data-icon="bulb" data-sub=""></header>
<main class="page"><div id="warn"></div><div class="grid" id="scenes"></div>
<div class="panel" style="margin-top:1rem"><h3>Beat flash <span class="chip" id="beat">Off</span></h3><p class="small" style="margin-top:.4rem">Tap the tempo in time with the music. Flashes are gentle brightness pulses, capped at 3 a second, never a white strobe. Browsers cannot hear the music, so the beat follows the tempo you tap.</p></div></main>
<script src="../shared/config.js"></script><script src="../shared/icons.js"></script><script src="../shared/app.js"></script>
<script>
// Talks to WLED's local JSON API (http://IP/json/state). A page served over https may be blocked by the browser from
// reaching an http device on your network ("mixed content"). If it fails, use the installed app version or WLED's own app.
var ip=A.cfg.wledIp;
if(!ip)A.state("#warn","empty","Add your lights","Enter the WLED address on the Settings page. The TV and lights must be on the same Wi-Fi.",'<a class="btn primary f" href="../settings/">Open Settings</a>');
var scenes=[{n:"Warm white",c:[255,170,80]},{n:"Party pink",c:[255,40,150]},{n:"Ocean blue",c:[20,90,255]},{n:"Green room",c:[30,220,90]},{n:"Amber",c:[255,120,0]},{n:"Violet",c:[150,60,255]},{n:"Cool white",c:[200,220,255]},{n:"Rainbow",fx:9}];
function send(b){if(!ip){A.toast("Add the lights address in Settings");return Promise.resolve()}
  return fetch("http://"+ip+"/json/state",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)}).then(function(r){if(!r.ok)throw new Error("WLED answered "+r.status)})
  .catch(function(e){A.toast("Cannot reach the lights at "+ip+". Same Wi-Fi? (browsers can block this over https)",5000)})}
scenes.forEach(function(s){var c=A.el("div",{class:"card f sc",role:"button"},'<div class="sw" style="background:'+(s.c?'rgb('+s.c.join(",")+')':'linear-gradient(90deg,#f44,#fa4,#4f4,#4af,#a4f)')+'"></div><h3>'+s.n+'</h3>');
  c.onclick=function(){send({on:true,bri:160,seg:[s.fx!==undefined?{fx:s.fx}:{fx:0,col:[s.c]}]})};A.$("#scenes").appendChild(c)});
var bpm=120,taps=[],timer=null,hi=false;
function run(on){clearInterval(timer);timer=null;if(on)timer=setInterval(function(){hi=!hi;send({bri:hi?200:90,transition:2})},Math.max(334,60000/bpm));A.$("#beat").textContent=on?bpm+" BPM":"Off"}
function tap(){var n=Date.now();if(taps.length&&n-taps[taps.length-1]>2000)taps=[];taps.push(n);if(taps.length>1){var s=0;for(var i=1;i<taps.length;i++)s+=taps[i]-taps[i-1];bpm=Math.max(60,Math.min(180,Math.round(60000/(s/(taps.length-1)))));if(timer)run(true);else A.$("#beat").textContent=bpm+" BPM"}}
A.dock([{label:"Beat flash",icon:"bulb",key:"green",fn:function(){run(!timer)}},{label:"Tap tempo",icon:"play",key:"yellow",fn:tap},{label:"Lights off",icon:"moon",key:"red",fn:function(){send({on:false})}},{label:"On",icon:"check",key:"blue",fn:function(){send({on:true})}}]);
</script></body></html>
