<!doctype html>
<html lang="en-GB" data-root="../"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ambient Clock · Apex TV</title><meta name="theme-color" content="#000000"><link rel="manifest" href="../manifest.webmanifest"><link rel="icon" href="../favicon.svg">
<link rel="stylesheet" href="../shared/style.css">
<style>
html,body{background:#000;height:100%;overflow:hidden;padding:0}
body{background:radial-gradient(900px 600px at 50% 40%,#16130a,#000 70%)}
#stage{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;transition:transform 2s}
#t{font-size:clamp(5rem,26vw,22rem);font-weight:200;letter-spacing:-.02em;line-height:1}
#d{font-size:clamp(1rem,2.6vw,2.4rem);color:var(--ink2);margin-top:.5rem}
#w{margin-top:2rem;font-size:clamp(1rem,2.2vw,2rem);color:var(--ink2);display:flex;gap:1.2rem;align-items:center;flex-wrap:wrap;justify-content:center}
#w b{color:var(--gold2);font-weight:650}
.top{position:fixed;left:0;right:0;top:0;z-index:20;padding:.8rem var(--pad);display:flex;align-items:center;gap:.7rem;transition:opacity .4s}
.top .back{display:grid;place-items:center;width:2.4rem;height:2.4rem;border-radius:50%;background:#ffffff22}
.off{opacity:0;pointer-events:none}
</style></head><body>
<div class="top ui" id="top"><a class="back f" href="../index.html" aria-label="Back to home">&#8249;</a><b>Ambient Clock</b></div>
<div id="stage"><div id="t" class="tnum"></div><div id="d"></div><div id="w"><div class="sk" style="width:16rem;height:1.6rem"></div></div></div>
<script src="../shared/config.js"></script><script src="../shared/icons.js"></script><script src="../shared/app.js"></script>
<script>
// Weather from Open-Meteo (free, no key). The clock drifts slightly each minute to protect OLED screens.
var P=A.cfg.place||{name:"Home",lat:51.42,lon:-1.73};
var codes={0:"Clear",1:"Mostly clear",2:"Part cloud",3:"Overcast",45:"Fog",48:"Fog",51:"Light drizzle",53:"Drizzle",55:"Heavy drizzle",61:"Light rain",63:"Rain",65:"Heavy rain",71:"Light snow",73:"Snow",75:"Heavy snow",80:"Showers",81:"Showers",82:"Heavy showers",95:"Thunderstorm"};
function tick(){var n=new Date();A.$("#t").textContent=A.pad(n.getHours())+":"+A.pad(n.getMinutes());
  A.$("#d").textContent=n.toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
  A.$("#stage").style.transform="translate("+((n.getMinutes()%7)-3)*5+"px,"+((n.getMinutes()%5)-2)*5+"px)"}
function wx(){A.getJSON("https://api.open-meteo.com/v1/forecast?latitude="+P.lat+"&longitude="+P.lon+"&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min&timezone=auto").then(function(d){
  var c=d.current,w=A.$("#w");w.innerHTML='<span>'+A.esc(P.name)+'</span><b>'+Math.round(c.temperature_2m)+'°C</b><span>'+(codes[c.weather_code]||"")+'</span><span class="dim">Today '+Math.round(d.daily.temperature_2m_min[0])+'° to '+Math.round(d.daily.temperature_2m_max[0])+'°</span>'})
  .catch(function(e){A.$("#w").innerHTML='<span class="dim">Weather unavailable ('+A.esc(e.message)+')</span>'})}
var ut;function wakeUI(){A.$("#top").classList.remove("off");clearTimeout(ut);ut=setTimeout(function(){A.$("#top").classList.add("off")},4000)}
["mousemove","touchstart","keydown","click"].forEach(function(ev){addEventListener(ev,wakeUI,{passive:true})});
A.on("back",function(){A.goHome()});
tick();wx();wakeUI();A.keepAwake();setInterval(tick,1000);setInterval(wx,900000);
</script></body></html>
