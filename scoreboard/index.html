<!doctype html><html><head><meta charset="utf-8"><title>Scoreboard</title>
<link rel="stylesheet" href="shared/common.css"><style>.n{font-size:9em;text-align:center;line-height:1}.t{text-align:center;font-size:1.4em;color:var(--dim)}</style></head><body>
<div class="top"><h1>Scoreboard</h1><span id="clock" style="font-size:2.4em">00:00</span></div>
<div class="wrap" style="display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:40px">
<div class="panel"><div class="t">HOME</div><div class="n" id="h">0</div></div><div class="panel"><div class="t">AWAY</div><div class="n" id="a">0</div></div></div>
<script>window.HINTS='<span class="c-r">RED home +1</span><span class="c-b">BLUE away +1</span><span class="c-g">GREEN start/stop clock</span><span class="c-y">YELLOW undo / hold reset</span>◀ home − ▶ away −'</script>
<script src="shared/config.js"></script><script src="shared/common.js"></script>
<script>
var s={h:0,a:0,t:0},run=false,hist=[],last=Date.now();
function draw(){A.$("#h").textContent=s.h;A.$("#a").textContent=s.a;A.$("#clock").textContent=A.pad(Math.floor(s.t/60))+":"+A.pad(s.t%60);A.store("sb",s)}
function add(k,d){hist.push([k,d]);s[k]=Math.max(0,s[k]+d);draw()}
A.on("red",function(){add("h",1)});A.on("blue",function(){add("a",1)});A.on("left",function(){add("h",-1)});A.on("right",function(){add("a",-1)});
A.on("green",function(){run=!run;A.toast(run?"Clock running":"Clock stopped")});
A.on("yellow",function(){var u=hist.pop();if(u){s[u[0]]=Math.max(0,s[u[0]]-u[1]);draw()}});
A.on("down",function(){s={h:0,a:0,t:0};hist=[];draw();A.toast("Reset")});
setInterval(function(){if(run){s.t++;draw()}},1000);
var sv=A.store("sb");if(sv){s=sv}draw();
</script></body></html>
