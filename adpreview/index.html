<!doctype html>
<html lang="en-GB" data-root="../"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ad Preview · Apex TV</title><meta name="theme-color" content="#07080c"><link rel="manifest" href="../manifest.webmanifest"><link rel="icon" href="../favicon.svg">
<link rel="stylesheet" href="../shared/style.css">
<style>.stage{position:relative;display:grid;place-items:center;height:calc(100vh - 12rem);background:#000;border-radius:var(--r);overflow:hidden}
video{max-width:100%;max-height:100%}.safe{position:absolute;border:3px dashed var(--green);pointer-events:none;border-radius:.4rem}</style></head><body>
<header id="appbar" data-title="Ad Preview" data-icon="film" data-sub=""></header>
<main class="page"><div id="msg"></div><div class="stage" id="stage"><video id="v" controls playsinline></video></div></main>
<script src="../shared/config.js"></script><script src="../shared/icons.js"></script><script src="../shared/app.js"></script>
<script>
// Plays finished Hookreel ads (mp4 links). The green guide marks the area phone apps usually leave free of buttons and captions.
var urls=(A.cfg.adUrls||[]).slice(),i=0,v=A.$("#v"),guide=false;
function load(n){if(!urls.length)return;i=(n+urls.length)%urls.length;v.src=urls[i];v.play&&v.play().catch(function(){});A.$("#barsub").textContent="Ad "+(i+1)+" of "+urls.length}
function drawGuide(){var g=A.$(".safe");if(g)g.remove();if(!guide)return;var r=v.getBoundingClientRect(),s=A.$("#stage").getBoundingClientRect();
  A.$("#stage").appendChild(A.el("div",{class:"safe",style:"left:"+(r.left-s.left+r.width*.06)+"px;top:"+(r.top-s.top+r.height*.1)+"px;width:"+r.width*.88+"px;height:"+r.height*.72+"px"}))}
if(!urls.length){A.$("#stage").style.display="none";A.state("#msg","empty","No ads yet","Add mp4 links (from Hookreel's Earlier ads) on the Settings page, one per line.",'<a class="btn primary f" href="../settings/">Open Settings</a>')}
v.onerror=function(){A.toast("Could not play that file. Is it an https mp4?",4000)};v.onloadedmetadata=drawGuide;
A.on("right",function(){load(i+1)});A.on("left",function(){load(i-1)});
A.dock([{label:"Previous",icon:"back",fn:function(){load(i-1)}},{label:"Next",icon:"next",key:"green",fn:function(){load(i+1)}},{label:"Safe area",icon:"check",key:"yellow",fn:function(){guide=!guide;drawGuide()}},{label:"Loop",icon:"refresh",key:"red",fn:function(){v.loop=!v.loop;A.toast(v.loop?"Loop on":"Loop off")}}]);
load(0);
</script></body></html>
