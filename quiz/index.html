<!doctype html><html><head><meta charset="utf-8"><title>Quiz Night</title>
<link rel="stylesheet" href="shared/common.css"></head><body>
<div class="top"><h1>Quiz Night</h1><span id="round" class="dim"></span></div>
<div class="wrap"><div id="q" style="font-size:1.6em;min-height:220px"></div><div id="a" class="c-g" style="font-size:1.3em;min-height:60px"></div>
<div id="teams" style="display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-top:30px"></div></div>
<script>window.HINTS='◀ ▶ question<span class="c-y">YELLOW reveal answer</span>Teams: <b class="c-r">RED</b> <b class="c-g">GREEN</b> <b class="c-b">BLUE</b> +1 point (hold ▲▼ to adjust last)'</script>
<script src="shared/config.js"></script><script src="shared/common.js"></script>
<script>
// Questions come from questions.json. The sample ones are yours to replace. Press a colour to give that team a point.
var qs=[],i=0,teams=[{n:"Red",s:0},{n:"Green",s:0},{n:"Blue",s:0},{n:"Yellow",s:0}],lastTeam=0;
function draw(){var q=qs[i]||{q:"No questions loaded",a:""};A.$("#q").textContent=(i+1)+". "+q.q;A.$("#a").textContent="";A.$("#round").textContent="Question "+(i+1)+" of "+qs.length;
  var t=A.$("#teams");t.innerHTML="";teams.forEach(function(x,k){t.appendChild(A.el("div",{class:"panel",style:"text-align:center"+(k===lastTeam?";border-color:var(--gold)":""),text:x.n+": "+x.s}))})}
function pt(k,d){teams[k].s=Math.max(0,teams[k].s+d);lastTeam=k;draw();A.$("#a").textContent=""}
A.on("right",function(){i=Math.min(qs.length-1,i+1);draw()});A.on("left",function(){i=Math.max(0,i-1);draw()});
A.on("yellow",function(){A.$("#a").textContent="Answer: "+(qs[i]&&qs[i].a||"")});
A.on("red",function(){pt(0,1)});A.on("green",function(){pt(1,1)});A.on("blue",function(){pt(2,1)});
A.on("up",function(){pt(lastTeam,1)});A.on("down",function(){pt(lastTeam,-1)});A.on("enter",function(){pt(3,1)});
A.getJSON("questions.json").then(function(d){qs=d.questions;draw()}).catch(function(e){A.$("#q").textContent=e.message});
</script></body></html>
