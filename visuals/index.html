<!doctype html><html><head><meta charset="utf-8"><title>Beat Visuals</title>
<link rel="stylesheet" href="shared/common.css"><style>canvas{position:fixed;inset:0;width:100%;height:100%}#hud{position:fixed;top:24px;left:36px;z-index:2;color:#fff;text-shadow:0 0 8px #000;font-size:.8em}</style></head><body>
<canvas id="c"></canvas><div id="hud"></div>
<script>window.HINTS='<span class="c-r">RED scene</span><span class="c-g">GREEN calm mode</span><span class="c-y">YELLOW tap tempo</span>▲▼ BPM'</script>
<script src="shared/config.js"></script><script src="shared/common.js"></script>
<script>
// No microphone on a TV, so the beat is a clock you set. Press YELLOW (or OK) in time to tap the tempo.
// Safety: calm mode (on by default) removes flashing; brightness never jumps more than a soft pulse.
var cv=A.$("#c"),g=cv.getContext("2d"),W,H;function size(){W=cv.width=innerWidth;H=cv.height=innerHeight}size();addEventListener("resize",size);
var bpm=A.store("bpm")||124,scene=0,calm=A.store("calm")!==false,t0=performance.now(),taps=[];
var scenes=["Tunnel","Bars","Plasma","Orbits"];
function beatPhase(now){var spb=60000/bpm;return ((now-t0)%spb)/spb}
function hud(){A.$("#hud").textContent=scenes[scene]+"  "+bpm+" BPM  "+(calm?"calm":"full")}
function tap(){var n=performance.now();if(taps.length&&n-taps[taps.length-1]>2000)taps=[];taps.push(n);
  if(taps.length>1){var s=0;for(var i=1;i<taps.length;i++)s+=taps[i]-taps[i-1];bpm=Math.max(60,Math.min(200,Math.round(60000/(s/(taps.length-1)))));t0=n;A.store("bpm",bpm);hud()}}
A.on("red",function(){scene=(scene+1)%scenes.length;hud()});
A.on("green",function(){calm=!calm;A.store("calm",calm);hud()});
A.on("yellow",tap);A.on("enter",function(){tap()});
A.on("up",function(){bpm=Math.min(200,bpm+1);A.store("bpm",bpm);hud()});A.on("down",function(){bpm=Math.max(60,bpm-1);A.store("bpm",bpm);hud()});
A.on("left",function(){scene=(scene+scenes.length-1)%scenes.length;hud()});A.on("right",function(){scene=(scene+1)%scenes.length;hud()});
function frame(now){
  var p=beatPhase(now),pulse=Math.pow(1-p,3),amp=calm?0.35:1,time=now/1000;
  g.fillStyle="rgba(5,6,12,"+(calm?.25:.18)+")";g.fillRect(0,0,W,H);
  var cx=W/2,cy=H/2;
  if(scene===0){for(var i=0;i<14;i++){var r=((i/14+time*.12)%1),rad=r*Math.max(W,H)*.7*(1+pulse*.08*amp);
    g.strokeStyle="hsla("+((i*26+time*30)%360)+",80%,"+(30+r*30)+"%,"+(1-r)+")";g.lineWidth=2+r*14;g.beginPath();g.arc(cx,cy,rad,0,6.283);g.stroke()}}
  if(scene===1){var n=48,bw=W/n;for(var j=0;j<n;j++){var v=.25+.35*Math.sin(time*2+j*.5)+.4*pulse*amp*Math.abs(Math.sin(j*1.7+time));
    g.fillStyle="hsl("+(200+j*3)+",80%,55%)";g.fillRect(j*bw+4,H-v*H*.9,bw-8,v*H*.9)}}
  if(scene===2){var s=40;for(var x=0;x<W;x+=s)for(var y=0;y<H;y+=s){var q=Math.sin(x*.01+time)+Math.sin(y*.012-time*1.3)+Math.sin((x+y)*.008+time*.7)+pulse*amp;
    g.fillStyle="hsla("+(((q+3)*60)%360)+",75%,50%,.35)";g.fillRect(x,y,s,s)}}
  if(scene===3){for(var k=0;k<9;k++){var a=time*(.3+k*.07)+k,rr=120+k*60+pulse*40*amp;
    g.fillStyle="hsl("+(k*40+time*20)%360+",85%,60%)";g.beginPath();g.arc(cx+Math.cos(a)*rr,cy+Math.sin(a)*rr*.6,18+pulse*22*amp,0,6.283);g.fill()}}
  requestAnimationFrame(frame)}
hud();requestAnimationFrame(frame);
</script></body></html>
